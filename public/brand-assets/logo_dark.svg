<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pratika-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pratika-dark-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00A3E0" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Stylized P & Wave) -->
  <g transform="translate(15, 15)">
    <!-- Outer Shield / Circle with dynamic gradient -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#pratika-dark-grad)" />
    
    <!-- Stylized 'P' / Facility emblem -->
    <path d="M40 32 H68 C82 32 92 42 92 56 C92 70 82 80 68 80 H54 V95 C54 97.2 52.2 99 50 99 H44 C41.8 99 40 97.2 40 95 V32 Z" fill="#FFFFFF" />
    <path d="M54 44 H67 C75 44 80 49 80 56 C80 63 75 68 67 68 H54 V44 Z" fill="#0B3B60" />
    
    <!-- Dynamic swoop/accent line -->
    <path d="M25 88 C45 88, 55 102, 95 96" stroke="url(#pratika-dark-wave)" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(155, 30)">
    <!-- PRÁTIKA -->
    <text x="0" y="52" font-family="'Inter', 'Montserrat', 'Roboto', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      PRÁTIKA
    </text>
    
    <!-- Accent dot/mark on Á -->
    <path d="M85 6 L97 -2 L103 2 L91 10 Z" fill="#00A3E0" />

    <!-- FACILITIES -->
    <text x="3" y="86" font-family="'Inter', 'Roboto Condensed', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="11" fill="#38BDF8">
      FACILITIES
    </text>
  </g>
</svg>
