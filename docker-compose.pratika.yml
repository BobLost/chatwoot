version: '3.8'

services:
  base: &base
    image: ghcr.io/boblost/chatwoot:pratika-latest
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    container_name: pratika_chatwoot_rails
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_NAME=Prátika Facilities
      - BRAND_NAME=Prátika Facilities
      - BRAND_URL=https://pratika.com.br
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    container_name: pratika_chatwoot_sidekiq
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: pratika_chatwoot_postgres
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pratika_secret_db_2026}

  redis:
    image: redis:7-alpine
    container_name: pratika_chatwoot_redis
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-pratika_redis_pass_2026}']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

volumes:
  postgres_data:
  redis_data:
  storage_data:
